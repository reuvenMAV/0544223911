# Worker service. In Railway set Root Directory to `openreply`.
# Use Railway internal DATABASE_URL / REDIS_URL on this service.
# Use the public proxy URLs on Vercel.

[build]
builder = "NIXPACKS"
buildCommand = "npm run db:generate"

[deploy]
startCommand = "npm run worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
